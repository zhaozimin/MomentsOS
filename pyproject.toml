[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momentsos"
version = "0.1.0"
description = "Local-first context framework for drafting WeChat Moments posts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "zhaozimin" }]
keywords = ["wechat", "moments", "context", "local-first", "writing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
momentsos = "momentsos.cli:main"

[tool.setuptools]
packages = ["momentsos"]
